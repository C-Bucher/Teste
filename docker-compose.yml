# NOTA: Sobe tudo junto com um comando: db (MySQL), redis, backend (FastAPI) e frontend (tela),
#       com as variáveis lidas do arquivo .env.
services:
  db:
    image: mysql:8.0
    container_name: techconnect_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s

  redis:
    image: redis:7-alpine
    container_name: techconnect_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: techconnect_backend
    restart: always
    working_dir: /app
    env_file:
      - .env
    environment:
      - MYSQL_HOST=db
      # MySQL do próprio Compose por padrão; para usar o Supabase no Docker, defina COMPOSE_DATABASE_URL no .env (DB-5)
      - DATABASE_URL=${COMPOSE_DATABASE_URL:-mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: techconnect_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started


volumes:
  mysql_data:
