version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: techconnect_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: techconnect
      MYSQL_USER: techuser
      MYSQL_PASSWORD: techpassword123
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s

  redis:
    image: redis:7-alpine
    container_name: techconnect_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: techconnect_backend
    restart: always
    working_dir: /app
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=techconnect
      - MYSQL_USER=techuser
      - MYSQL_PASSWORD=techpassword123
      - SECRET_KEY=***REMOVED-SECRET_KEY***
      - ALGORITHM=HS256
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=***REMOVED-GEMINI_API_KEY***
    volumes:
      - ./:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: techconnect_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started


volumes:
  mysql_data:
  uploads_data:
